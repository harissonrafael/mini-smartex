[project]
name = "mini-smartex"
version = "0.1.0"
description = "Mini-SMARTEX: simulador de extrusora e pipeline de dados para estudo"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymodbus>=3.16.2",
    "tzdata>=2026.6",
]

[project.scripts]
simulador = "mini_smartex.simulador:main"
leitor = "mini_smartex.leitor:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
